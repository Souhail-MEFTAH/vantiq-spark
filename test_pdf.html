<!DOCTYPE html>
<html>

<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js"></script>
</head>

<body>
    <script>
        window.onerror = function (msg) { document.body.innerHTML += "<p style='color:red'>" + msg + "</p>"; };

        setTimeout(() => {
            try {
                pdfMake.fonts = {
                    Roboto: {
                        normal: 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/fonts/Roboto/Roboto-Regular.ttf'
                    }
                };
                var docDefinition = { content: 'This is an sample PDF printed with pdfMake' };
                pdfMake.createPdf(docDefinition).download();
                document.body.innerHTML += "<p>Success!</p>";
            } catch (e) {
                document.body.innerHTML += "<p style='color:red'>Catch: " + e.message + "</p>";
            }
        }, 1000);
    </script>
</body>

</html>
